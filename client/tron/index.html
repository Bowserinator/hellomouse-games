<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Lightcycle battle for up to 6 players.">
    <meta name="author" content="Bowserinator">
    <meta name="theme-color" content="#000000">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Hellomouse Games">
    <meta property="og:title" content="Tron - Hellomouse Games">
    <meta property="og:description" content="Lightcycle battle for up to 6 players.">
    <meta property="og:image" content="https://games.hellomouse.net/tron/img/thumbnail.jpg">
    <meta property="og:image:width" content="560">
    <meta property="og:image:height" content="300">
    <meta property="og:image:alt" content="Tron lightcycle game">
    <meta property="og:url" content="https://games.hellomouse.net/tron/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tron - Hellomouse Games">
    <meta name="twitter:description" content="Lightcycle battle for up to 6 players.">
    <meta name="twitter:image" content="https://games.hellomouse.net/tron/img/thumbnail.jpg">
    <title>Tron</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <script src="/shared/js/index.js" defer></script>
    <script src="js/game.js" type="module"></script>
</head>
<body>
    <p id="disconnect-banner" role="alert" hidden></p>
    <canvas id="board" oncontextmenu="return false;"></canvas>
    <p id="ping"></p>

    <aside id="hud" hidden>
        <p id="round"></p>
        <ol id="scores"></ol>
    </aside>
    <p id="banner" hidden></p>
    <p id="spectate" hidden></p>

    <main id="lobby">
        <header>
            <h1>TRON</h1>
            <a href="/" target="_blank" rel="noopener">More games ↗</a>
        </header>
        <ol id="players"></ol>
        <form id="username-form">
            <input id="username" maxlength="16" pattern="[A-Za-z0-9_]+" placeholder="Name" aria-label="Name" autocomplete="off" required>
            <button type="submit">Set</button>
        </form>
        <div id="colors" class="chip-group" aria-label="Color"></div>

        <div class="button-row">
            <button id="ready" type="button">Ready</button>
            <button id="start-game" class="primary" type="button">Start</button>
        </div>
        <div class="input-row" id="invite-row">
            <input id="invite" readonly aria-label="Invite link">
            <button id="copy-invite" type="button">Copy</button>
        </div>
        <br><br>

        <span class="field-label">Map</span>
        <div id="size-option" class="toggle-group"></div>
        <span class="field-label">Speed</span>
        <div id="speed-option" class="toggle-group"></div>
        <span class="field-label">Rounds</span>
        <div id="rounds-option" class="toggle-group"></div>
    </main>

    <dialog id="results">
        <ol id="result-list"></ol>
        <button id="results-close" type="button">Close</button>
    </dialog>
</body>
</html>
